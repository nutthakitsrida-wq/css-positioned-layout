<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <div class="page">
    <div class="chatroom">
      <header class="chatroom-header">
        <h1>Techup Chatroom</h1>
      </header>

      <div class="chat-area">
        <div class="message-row">
          <div class="bubble-wrap bubble-wrap-right">
            <div class="bubble bubble-green bubble-tail">สวัสดีจ้า</div>
          </div>
        </div>

        <div class="message-row">
          <div class="bubble-wrap bubble-wrap-right">
            <div class="bubble bubble-light-gray">
              Coding สนุกจังเลย
              <button type="button" class="close-btn" aria-label="Close message">×</button>
            </div>
          </div>
        </div>

        <div class="message-row">
          <div class="bubble-wrap bubble-wrap-right">
            <div class="bubble bubble-green">😍 🤩</div>
          </div>
        </div>

        <div class="message-row">
          <div class="bubble-wrap bubble-wrap-left">
            <div class="bubble bubble-gray">😍</div>
          </div>
        </div>

        <div class="message-row">
          <div class="bubble-wrap bubble-wrap-left">
            <div class="bubble bubble-gray">🥳</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
